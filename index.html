<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Jazmin & Albert | Save the Date</title>

<style>

/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  background: #ffffff;
  color: #171717;
  font-family: Georgia, "Times New Roman", serif;
  overflow-x: hidden;
}

.invitation {
  position: relative;
  width: 100%;
  min-height: 100vh;
  padding: 65px 22px 60px;
  text-align: center;
  overflow: hidden;
}


/* =========================
   BACKGROUND WATERMARK
========================= */

.watermark {
  position: absolute;

  top: 0;
  left: 50%;

  transform: translateX(-50%);

  width: 100%;
  max-width: 650px;
  height: 900px;

  background-image:
    url("SAVE THE DATE JAZ-ALB-079.jpeg");

  background-size: cover;
  background-position: center top;
  background-repeat: no-repeat;

  filter:
    grayscale(100%)
    brightness(1.15);

  opacity: 0.065;

  -webkit-mask-image:
    linear-gradient(
      to bottom,
      black 0%,
      black 52%,
      transparent 100%
    );

  mask-image:
    linear-gradient(
      to bottom,
      black 0%,
      black 52%,
      transparent 100%
    );

  pointer-events: none;
}


/* =========================
   CONTENT
========================= */

.content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
}


/* =========================
   TOP DETAILS
========================= */

.top-details {
  display: flex;
  justify-content: space-between;

  margin-bottom: 105px;

  font-size: 9px;
  letter-spacing: 4px;
  line-height: 2;
}

.top-left {
  text-align: left;
}

.top-right {
  text-align: right;
}

.small-line {
  display: block;
  width: 42px;
  height: 1px;
  margin-top: 14px;
  background: #777;
}

.top-right .small-line {
  margin-left: auto;
}


/* =========================
   SAVE THE DATE
========================= */

.save {
  margin-bottom: 35px;
  font-size: 13px;
  font-weight: normal;
  letter-spacing: 7px;
}


/* =========================
   NAMES
========================= */

.name {
  font-size: clamp(47px, 14vw, 72px);
  font-weight: 400;
  line-height: 1.08;
  letter-spacing: 9px;
}

.ampersand {
  margin: 3px 0 5px;

  color: #c7b7a4;

  font-family:
    "Times New Roman",
    Georgia,
    serif;

  font-size: 57px;
  font-style: italic;
  font-weight: 300;
  line-height: 1;
}


/* =========================
   DATE
========================= */

.date {
  margin-top: 24px;
  font-size: 18px;
  letter-spacing: 8px;
}


/* =========================
   SUBTITLE
========================= */

.subtitle {
  margin: 45px auto 28px;
  font-size: 10px;
  letter-spacing: 4.5px;
  line-height: 2;
}


/* =========================
   SCRATCH CARD
========================= */

.scratch-wrapper {
  position: relative;

  width: 100%;
  max-width: 390px;

  aspect-ratio: 4 / 5;

  margin: 20px auto 0;

  overflow: hidden;

  background: #ffffff;

  border-radius: 4px;

  box-shadow:
    0 10px 40px rgba(0,0,0,0.035);
}


/* PHOTO */

.reveal-photo {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  user-select: none;
  -webkit-user-drag: none;
}


/* SCRATCH CANVAS */

#scratchCanvas {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 5;

  touch-action: none;

  opacity: 1;

  transition:
    opacity 0.75s ease;
}


/* SCRATCH MESSAGE */

.scratch-instruction {
  position: absolute;

  top: 50%;
  left: 50%;

  transform:
    translate(-50%, -50%)
    rotate(-4deg);

  z-index: 6;

  pointer-events: none;

  color: #8f806f;

  font-family:
    "Snell Roundhand",
    "Brush Script MT",
    cursive;

  font-size: 34px;

  line-height: 1.05;

  transition:
    opacity 0.35s ease;
}

.heart {
  display: block;

  margin-top: 13px;

  font-family: Georgia, serif;

  font-size: 28px;
}


/* =========================
   BOTTOM
========================= */

.bottom {
  margin-top: 38px;
}

.vertical-line {
  width: 1px;
  height: 35px;
  margin: 0 auto;
  background: #777;
}

.forever {
  margin-top: 22px;
  font-size: 10px;
  letter-spacing: 5px;
}

.arrow {
  width: 18px;
  height: 18px;

  margin: 26px auto 0;

  border-right: 1px solid #111;
  border-bottom: 1px solid #111;

  transform: rotate(45deg);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 390px) {

  .invitation {
    padding:
      55px
      18px
      55px;
  }

  .top-details {
    margin-bottom: 90px;
    font-size: 8px;
    letter-spacing: 3px;
  }

  .save {
    font-size: 11px;
    letter-spacing: 6px;
  }

  .name {
    letter-spacing: 7px;
  }

  .date {
    font-size: 16px;
    letter-spacing: 6px;
  }

  .subtitle {
    letter-spacing: 3.5px;
  }

}

</style>
</head>

<body>

<section class="invitation">

  <div class="watermark"></div>

  <div class="content">


    <!-- TOP -->

    <div class="top-details">

      <div class="top-left">

        LOVE<br>
        ALWAYS

        <span class="small-line"></span>

      </div>


      <div class="top-right">

        A BEAUTIFUL<br>
        TOMORROW

        <span class="small-line"></span>

      </div>

    </div>


    <!-- SAVE THE DATE -->

    <div class="save">
      SAVE THE DATE
    </div>


    <!-- NAMES -->

    <h1 class="name">
      JAZMIN
    </h1>

    <div class="ampersand">
      &amp;
    </div>

    <h1 class="name">
      ALBERT
    </h1>


    <!-- DATE -->

    <div class="date">
      02 · 19 · 2027
    </div>


    <!-- SUBTITLE -->

    <div class="subtitle">

      A BEAUTIFUL TOMORROW
      <br>
      TOGETHER

    </div>


    <!-- =========================
         SWIPE TO REVEAL
    ========================== -->

    <div class="scratch-wrapper">

      <img
        class="reveal-photo"
        src="SAVE THE DATE JAZ-ALB-079.jpeg"
        alt="Jazmin and Albert"
      >

      <canvas
        id="scratchCanvas">
      </canvas>

      <div
        class="scratch-instruction"
        id="scratchText"
      >

        Swipe
        <br>
        to reveal

        <span class="heart">
          ♡
        </span>

      </div>

    </div>


    <!-- BOTTOM -->

    <div class="bottom">

      <div class="vertical-line"></div>

      <div class="forever">
        OUR FOREVER BEGINS
      </div>

      <div class="arrow"></div>

    </div>


  </div>

</section>


<script>

/* =====================================
   SWIPE TO REVEAL
===================================== */

const canvas =
  document.getElementById("scratchCanvas");

const ctx =
  canvas.getContext("2d");

const scratchText =
  document.getElementById("scratchText");

let isDragging = false;
let revealed = false;

let maxRevealX = 0;


/* =====================================
   CREATE WHITE COVER
===================================== */

function createCover() {

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    Math.round(rect.width * ratio);

  canvas.height =
    Math.round(rect.height * ratio);


  ctx.setTransform(
    1,
    0,
    0,
    1,
    0,
    0
  );


  ctx.scale(
    ratio,
    ratio
  );


  /*
    CLEAN WHITE COVER
  */

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      rect.width,
      rect.height
    );


  gradient.addColorStop(
    0,
    "#ffffff"
  );

  gradient.addColorStop(
    0.5,
    "#f8f8f6"
  );

  gradient.addColorStop(
    1,
    "#ffffff"
  );


  ctx.globalCompositeOperation =
    "source-over";


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    rect.width,
    rect.height
  );

}


/* =====================================
   GET POSITION
===================================== */

function getPosition(event) {

  const rect =
    canvas.getBoundingClientRect();


  let clientX;
  let clientY;


  if (
    event.touches &&
    event.touches.length
  ) {

    clientX =
      event.touches[0].clientX;

    clientY =
      event.touches[0].clientY;

  } else {

    clientX =
      event.clientX;

    clientY =
      event.clientY;

  }


  return {

    x:
      clientX - rect.left,

    y:
      clientY - rect.top

  };

}


/* =====================================
   START SWIPE
===================================== */

function startSwipe(event) {

  if (revealed) return;


  isDragging = true;


  scratchText.style.opacity =
    "0";


  revealSwipe(event);

}


/* =====================================
   REVEAL DURING SWIPE
===================================== */

function revealSwipe(event) {

  if (
    !isDragging ||
    revealed
  ) {
    return;
  }


  event.preventDefault();


  const rect =
    canvas.getBoundingClientRect();


  const position =
    getPosition(event);


  /*
    Only increase the reveal area.
    Moving the finger backwards
    will not cover the photo again.
  */

  if (
    position.x > maxRevealX
  ) {

    maxRevealX =
      position.x;

  }


  /*
    Clean reveal:
    everything from the left edge
    up to the finger becomes visible.
  */

  ctx.globalCompositeOperation =
    "destination-out";


  ctx.fillRect(
    0,
    0,
    maxRevealX,
    rect.height
  );


  /*
    Calculate horizontal progress.
  */

  const percent =
    (
      maxRevealX /
      rect.width
    ) * 100;


  /*
    Reveal whole photo at 60%.
  */

  if (
    percent >= 30
  ) {

    revealEverything();

  }

}


/* =====================================
   FULL REVEAL
===================================== */

function revealEverything() {

  if (revealed) {
    return;
  }


  revealed = true;

  isDragging = false;


  scratchText.style.opacity =
    "0";


  /*
    Fade remaining cover away.
  */

  canvas.style.opacity =
    "0";


  setTimeout(

    function() {

      canvas.style.display =
        "none";

    },

    750

  );

}


/* =====================================
   TOUCH EVENTS
===================================== */

canvas.addEventListener(

  "touchstart",

  startSwipe,

  {
    passive: false
  }

);


canvas.addEventListener(

  "touchmove",

  revealSwipe,

  {
    passive: false
  }

);


canvas.addEventListener(

  "touchend",

  function() {

    isDragging = false;

  }

);


canvas.addEventListener(

  "touchcancel",

  function() {

    isDragging = false;

  }

);


/* =====================================
   MOUSE EVENTS
===================================== */

canvas.addEventListener(

  "mousedown",

  startSwipe

);


canvas.addEventListener(

  "mousemove",

  revealSwipe

);


window.addEventListener(

  "mouseup",

  function() {

    isDragging = false;

  }

);


/* =====================================
   INITIALIZE
===================================== */

window.addEventListener(

  "load",

  createCover

);

</script>

</body>
</html>
